<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>注册 - 工作日志</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
       background:linear-gradient(135deg,#667eea,#764ba2);
       font-family:-apple-system,"Microsoft YaHei",sans-serif;}
  .box{background:#fff;padding:40px 36px;border-radius:16px;
       box-shadow:0 20px 60px rgba(0,0,0,.25);width:360px;}
  h1{margin:0 0 24px;font-size:22px;text-align:center;color:#333;}
  input{width:100%;padding:12px 14px;margin-bottom:16px;
        border:1px solid #ddd;border-radius:8px;font-size:14px;}
  input:focus{outline:none;border-color:#667eea;}
  button{width:100%;padding:12px;background:#667eea;color:#fff;border:none;
         border-radius:8px;font-size:15px;cursor:pointer;}
  button:hover{background:#5568d3;}
  .err{color:#e74c3c;font-size:13px;min-height:18px;margin-bottom:8px;}
  .ok{color:#4caf50;font-size:13px;min-height:18px;margin-bottom:8px;}
  .link{text-align:center;margin-top:14px;font-size:13px;}
  .link a{color:#667eea;text-decoration:none;}
  .link a:hover{text-decoration:underline;}
  .hint{font-size:12px;color:#999;text-align:center;margin-top:10px;}
</style>
</head>
<body>
<div class="box">
  <h1>📝 注册账号</h1>
  <div class="err" id="err"></div>
  <div class="ok" id="ok"></div>
  <input id="u" placeholder="用户名（2-20位中文/字母/数字/下划线）" autocomplete="username">
  <input id="p" type="password" placeholder="密码（至少6位）" autocomplete="new-password">
  <input id="p2" type="password" placeholder="确认密码" autocomplete="new-password">
  <button onclick="doRegister()">注册</button>
  <div class="link">已有账号？<a href="/login">返回登录</a></div>
  <div class="hint">注册后即可拥有独立的日志空间</div>
  <div class="hint" id="ipInfo" style="color:#aaa;margin-top:8px;font-size:11px;">正在获取网络信息...</div>
</div>
<script>
// ★ 与后端 normalize_username 保持一致：去掉所有空白（含全角空格）
function normalizeUsername(s){
  return (s || '').replace(/[\s\u3000]+/g, '');
}

async function doRegister(){
  const u  = normalizeUsername(document.getElementById('u').value);
  const p  = document.getElementById('p').value;
  const p2 = document.getElementById('p2').value;
  const err = document.getElementById('err');
  const ok  = document.getElementById('ok');
  err.textContent = ''; ok.textContent = '';

  if(!u || !p){ err.textContent = '请填写完整信息'; return; }
  if(p !== p2){ err.textContent = '两次密码不一致'; return; }

  try{
    const res = await fetch('/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:u, password:p, confirm:p2})
    });
    const data = await res.json();
    if(data.ok){
      ok.textContent = '✅ 注册成功，正在跳转...';
      setTimeout(()=>location.href='/login', 1200);
    } else {
      err.textContent = data.msg || '注册失败';
    }
  }catch(e){ err.textContent = '网络错误，请重试'; }
}
document.getElementById('p2').addEventListener('keydown', e => {
  if (e.key === 'Enter') doRegister();
});
/* ---------- 公网出口IP获取与上报 ---------- */
async function fetchPublicIp(){
  const services = [
    {url:'https://api.ipify.org?format=json', pick:d=>d.ip},
    {url:'https://api.ip.sb/geoip', pick:d=>d.ip},
    {url:'https://api64.ipify.org?format=json', pick:d=>d.ip},
    {url:'https://ipinfo.io/json', pick:d=>d.ip},
    {url:'http://ip-api.com/json/?lang=zh-CN&fields=status,query', pick:d=>(d.status==='success'?d.query:null)}
  ];
  for(const s of services){
    try{
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), 5000);
      const res = await fetch(s.url, {signal:ctrl.signal});
      clearTimeout(timer);
      if(!res.ok) continue;
      const data = await res.json();
      const ip = s.pick(data);
      if(ip) return ip;
    }catch(e){}
  }
  return null;
}

(async function loadIpInfo(){
  const el = document.getElementById('ipInfo');
  try{
    const pub = await fetchPublicIp();
    if(pub){
      const rep = await fetch('/api/report-ip', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ip: pub})
      });
      const rd = await rep.json();
      if(rd.ok){
        el.textContent = `🌐 当前访问 IP：${rd.ip} · 位置：${rd.location}`;
        return;
      }
    }
  }catch(e){}
  try{
    const res = await fetch('/api/ip-info');
    const data = await res.json();
    if(data.ok){
      el.textContent = `🌐 当前访问 IP：${data.ip} · 位置：${data.location}`;
    } else {
      el.textContent = '';
    }
  }catch(e){
    el.textContent = '';
  }
})();
</script>
</body>
</html>
